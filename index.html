<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Moova | Reliable Delivery & Logistics</title>
    <meta name="title" content="Moova | Reliable Delivery & Logistics" />
    <meta name="description" content="Moova offers seamless, real-time tracking and delivery solutions for your business and personal needs." />
    <meta name="author" content="Moova" />
    <meta name="theme-color" content="#2648A6" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://moova-web.codemash.co.tz/" />
    <meta property="og:title" content="Moova | Reliable Delivery & Logistics" />
    <meta property="og:description" content="Moova offers seamless, real-time tracking and delivery solutions for your business and personal needs." />
    <meta property="og:image" content="/favicon.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://moova-web.codemash.co.tz/" />
    <meta property="twitter:title" content="Moova | Reliable Delivery & Logistics" />
    <meta property="twitter:description" content="Moova offers seamless, real-time tracking and delivery solutions for your business and personal needs." />
    <meta property="twitter:image" content="/favicon.png" />
    <style>
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
      .preloader-spinner {
        animation: preloader-spin 1.1s linear infinite;
      }
    </style>
  </head>
  <body class="bg-slate-50">
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; z-index: 9999; font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif;">
        <div style="position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: 0; border-radius: 9999px; border: 4px solid rgba(16, 185, 129, 0.18);"></div>
          <div class="preloader-spinner" style="position: absolute; inset: 0; border-radius: 9999px; border: 4px solid transparent; border-top-color: #10b981; border-right-color: #10b981;"></div>
          <img src="/src/assets/Loader/loader.png" alt="Loading" style="width: 48px; height: 48px; border-radius: 9999px; object-fit: contain;" />
        </div>
        <h3 style="margin-top: 20px; margin-bottom: 0; font-size: 20px; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; max-width: 440px; text-align: center;">Be Trusted from the first click</h3>
        <p style="margin-top: 8px; font-size: 14px; font-weight: 500; color: #64748b; max-width: 400px; text-align: center; line-height: 1.5;">Turn every first delivery into a reason for customers to come back.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
